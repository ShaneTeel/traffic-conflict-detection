[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conflict_detection"
version = "0.1.0"
description = "Computer Vision system coupled with GIS analysis for identifying, cataloguing, and evaluating traffic conflict events."
readme = "README.md"
requires-python = ">=3.8"
license = {file="LICENSE"}
authors = [
    {name = "Shane Teel"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent"
]
dependencies = [
    "ultralytics==8.4.41",
    "opencv-python==4.13.0.92",
    "numpy==2.4.4",
    "supervision==0.27.0",
    "utm==0.8.1",
    "folium==0.20.0"
]

[project.urls]
Homepage = "https://github.com/ShaneTeel/traffic-conflict-detection"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*"]